name: CI Pipeline

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

jobs:
  build:
    name: Build & Validate
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Cache Node Modules
      uses: actions/cache@v4
      with:
        path: scoutasset.client/node_modules
        key: ${{ runner.os }}-node-${{ hashFiles('scoutasset.client/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-

    - name: Install Frontend Dependencies
      run: |
        cd scoutasset.client
        npm install

    - name: Build Frontend
      run: |
        cd scoutasset.client
        npm run build

    - name: Restore Backend Dependencies
      run: dotnet restore ScoutAsset.Server/ScoutAsset.Server.csproj

    - name: Build Backend
      run: dotnet build ScoutAsset.Server/ScoutAsset.Server.csproj --no-restore -c Release
