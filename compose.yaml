services:
  scout-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scout-asset-app
    restart: always
    ports:
      - "${APP_PORT:-${ASPNETCORE_HTTP_PORTS:-8080}}:${ASPNETCORE_HTTP_PORTS:-8080}"
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ASPNETCORE_HTTP_PORTS=${ASPNETCORE_HTTP_PORTS:-8080}
    networks:
      - infra

networks:
  infra:
    name: infra
    external: true
