<div class="page-container">
  <div class="page-header">
    <h2>Categorías</h2>
    <div class="page-actions" style="display: flex; gap: 8px;">
      <button mat-stroked-button color="primary" (click)="openImportDialog()">
        <mat-icon>upload_file</mat-icon> Carga Masiva (Excel)
      </button>
      <button mat-raised-button color="primary" (click)="create()">
        <mat-icon>add</mat-icon> Nueva Categoría
      </button>
    </div>
  </div>

  <div class="table-responsive">
  <mat-table [dataSource]="dataSource" matSort class="mat-elevation-z1">
    <ng-container matColumnDef="name">
      <mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</mat-header-cell>
      <mat-cell *matCellDef="let cat">
        <ng-container *ngIf="editingId === cat.id; else nameDisplay">
          <mat-form-field appearance="outline">
            <input matInput [(ngModel)]="editName" />
          </mat-form-field>
        </ng-container>
        <ng-template #nameDisplay>{{ cat.name }}</ng-template>
      </mat-cell>
    </ng-container>
    <ng-container matColumnDef="prefix">
      <mat-header-cell *matHeaderCellDef mat-sort-header>Prefijo</mat-header-cell>
      <mat-cell *matCellDef="let cat">
        <ng-container *ngIf="editingId === cat.id; else prefixDisplay">
          <mat-form-field appearance="outline">
            <input matInput [(ngModel)]="editPrefix" />
          </mat-form-field>
        </ng-container>
        <ng-template #prefixDisplay>{{ cat.prefix }}</ng-template>
      </mat-cell>
    </ng-container>
    <ng-container matColumnDef="actions">
      <mat-header-cell *matHeaderCellDef>Acciones</mat-header-cell>
      <mat-cell *matCellDef="let cat">
        <ng-container *ngIf="editingId === cat.id; else actionBtns">
          <button mat-icon-button color="primary" matTooltip="Guardar" (click)="saveEdit(cat)">
            <mat-icon>check</mat-icon>
          </button>
          <button mat-icon-button matTooltip="Cancelar" (click)="cancelEdit()">
            <mat-icon>close</mat-icon>
          </button>
        </ng-container>
        <ng-template #actionBtns>
          <button mat-icon-button color="primary" matTooltip="Editar" (click)="startEdit(cat)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" matTooltip="Eliminar" (click)="delete(cat.id)">
            <mat-icon>delete</mat-icon>
          </button>
        </ng-template>
      </mat-cell>
    </ng-container>

    <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
    <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
  </mat-table>
  </div>
  <mat-paginator [pageSizeOptions]="[10, 25, 50, 100]" pageSize="10" showFirstLastButtons></mat-paginator>
</div>
