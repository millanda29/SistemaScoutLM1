services:
  scout-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scout-asset-app
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080

  # Opcional: si en el servidor se desea levantar también la base de datos SQL Server
  # con Docker Compose, basta con descomentar el bloque siguiente:
